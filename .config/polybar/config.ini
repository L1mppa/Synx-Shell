include-file = polybar-colors.ini
[bar/main]
width = 90%
height = 30pt
offset-x = 5%
offset-y = 1%
radius = 0
fixed-center = false

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-left-size = 2pt
border-right-size = 2pt
border-bottom-size = 2pt
border-top-size = 2pt
border-color = ${colors.outline}

padding-left = 1
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = Iosevka Nerd Font Mono:style=Regular;2
font-1 = Noto Sans Mono:style=Regular;2

modules-left = bspwm xwindow
modules-right = pulseaudio memory cpu network mpris-control mpris-status systray date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
wm-restack = bspwm
; wm-restack = i3

override-redirect = false

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 2pt
tray-spacing = 4pt

[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background-active}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground-alt}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.foreground-alt}
label-urgent-background = ${colors.background-active}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %class%
label-maxlen = 24
label-ellipsis = true

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/network]
type = custom/script
exec = bash ~/.config/polybar/scripts/network.sh
interval = 5
format = <label>
label-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/mpris-control]
type = custom/script
interval = 2
exec = bash ~/.config/polybar/scripts/mpris/mpris_control.sh --controls
format = <label>
click-left = bash ~/.config/polybar/scripts/mpris/mpris_control.sh --select
scroll-up = bash ~/.config/polybar/scripts/mpris/mpris_control.sh --vc 0.05+
scroll-down = bash ~/.config/polybar/scripts/mpris/mpris_control.sh --vc 0.05-

[module/mpris-status]

type = custom/script
tail = true
interval = 1
; prefix symbol is shown before the text
format = <label>
label = %output%
label-maxlen = 24
label-ellipsis = true
exec = bash ~/.config/polybar/scripts/mpris/scroll.sh
click-left = bash ~/.config/polybar/scripts/mpris/mpris_control.sh --select
scroll-up = bash ~/.config/polybar/scripts/mpris/mpris_control.sh --vc 0.05+
scroll-down = bash ~/.config/polybar/scripts/mpris/mpris_control.sh --vc 0.05-

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
